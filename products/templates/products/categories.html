{% extends 'layouts/blank.html' %}
{% block content %}




<div class="bg-gray-50 min-h-screen py-16 px-6">
    
    <h1 class="text-4xl text-gray-900 font-extrabold text-center mb-12">
        Explore Categories
    </h1>



    <div class="max-w-4xl mx-auto mb-10">
    <form method="GET">
        <input
            type="text"
            name="search"
            placeholder="Search category..."
            value="{{ search }}"
            class="w-full px-5 py-3 border rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </form>
</div>





    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-8 max-w-7xl mx-auto">
        
        {% for category in categories %}
        <a href="{{ category.get_absolute_url }}" 
           class="group flex flex-col items-center p-5 bg-gray-900 rounded-3xl shadow-lg border border-gray-800 transition-all duration-300 hover:bg-gray-800 hover:shadow-2xl hover:-translate-y-2">
            
            <div class="w-full aspect-square mb-5 overflow-hidden rounded-2xl bg-gray-800 border border-gray-700">
                <img src="{{ category.image.url }}" alt="{{ category.name }}" 
                     class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
            </div>

            <h2 class="text-white font-medium text-center text-sm md:text-base">
                {{ category.name }}
            </h2>
        </a>
        {% endfor %}
        
    </div>
</div>
{% endblock content %}
