{% extends 'layouts/blank.html' %}

{% block content %}

<div class="bg-gray-50 min-h-screen py-16 px-6">

    <div class="max-w-6xl mx-auto">

        <div class="bg-white rounded-3xl shadow-xl overflow-hidden">

            <div class="grid md:grid-cols-2">

                <!-- Image -->

                <div class="p-10 flex justify-center items-center bg-gray-100">

                    <img
                        src="{{ product.image_url }}"
                        alt="{{ product.name }}"
                        class="max-h-[500px] object-contain">

                </div>

                <!-- Details -->

                <div class="p-10 flex flex-col justify-center">

                    <span class="text-sm text-gray-500 uppercase">

                        {{ product.category.name }}

                    </span>

                    <h1 class="text-4xl font-extrabold mt-2">

                        {{ product.name }}

                    </h1>

                    <div class="mt-6 flex items-center gap-8">

                        <span class="text-4xl font-bold text-green-600">

                            ${{ product.price }}

                        </span>

                        <span class="text-2xl text-yellow-500">

                            ⭐ {{ product.rating }}

                        </span>

                    </div>

                    <div class="mt-10 flex gap-4">

                        <a
                            href="{{ product.product_url }}"
                            target="_blank"
                            class="px-6 py-3 bg-gray-900 text-white rounded-xl hover:bg-gray-800">

                            View Original

                        </a>

                        <a
                            href="{% url 'products:products' product.category.pk %}"
                            class="px-6 py-3 border rounded-xl hover:bg-gray-100">

                            Back

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
